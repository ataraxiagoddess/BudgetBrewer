ksp = "2.3.9"
coreKtx = "1.19.0"
appcompat = "1.7.1"
material = "1.14.0"
constraintlayout = "2.2.1"
junit = "4.13.2"
androidJunit = "1.3.0"
espresso = "3.7.0"
multiplatformSettings = "1.3.0"
room = "2.8.4"
lifecycle = "2.11.0"
coroutines = "1.11.0"
mpandroidchart = "v3.1.0"
timber = "5.0.1"
