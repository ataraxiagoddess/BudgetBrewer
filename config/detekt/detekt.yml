complexity:
  LongMethod:
    threshold: 300
  CyclomaticComplexMethod:
    threshold: 60
  LongParameterList:
    functionThreshold: 12
    constructorThreshold: 12
  LargeClass:
    threshold: 1500
  TooManyFunctions:
    thresholdInFiles: 50
    thresholdInClasses: 50
    thresholdInInterfaces: 50
    thresholdInObjects: 50
    thresholdInEnums: 50
    ignorePrivate: true
style:
  ReturnCount:
    max: 6
    excludeGuardClauses: true
  MaxLineLength:
    maxLineLength: 200
  MagicNumber:
    active: false
  ThrowsCount:
    max: 5
  LoopWithTooManyJumpStatements:
    maxJumpCount: 3
  ForbiddenComment:
    active: false
exceptions:
  TooGenericExceptionCaught:
    active: false
  TooGenericExceptionThrown:
    active: false
  PrintStackTrace:
    active: false
empty-blocks:
  EmptyFunctionBlock:
    active: false
naming:
  ConstructorParameterNaming:
    active: false
  VariableNaming:
    active: false
potential-bugs:
  ImplicitDefaultLocale:
    active: false
